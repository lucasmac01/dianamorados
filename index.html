<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gatinho ❤️ Gatinha</title>
  <style>
    :root {
      --bg: #fff4f4;
      --surface: #ffffff;
      --surface-soft: #fffafa;
      --ink: #202a3f;
      --muted: #7d819d;
      --accent: #ff656b;
      --accent-strong: #f64f60;
      --accent-soft: #ffe4e5;
      --line: rgba(255, 101, 107, 0.18);
      --shadow: 0 28px 70px rgba(255, 101, 107, 0.16), 0 10px 26px rgba(48, 54, 78, 0.06);
      --radius-lg: 44px;
      --radius-md: 34px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    button {
      font: inherit;
    }

    .page {
      position: relative;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 24px 18px 34px;
    }

    .brand {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 26px;
      color: var(--accent);
      font-size: clamp(1.55rem, 4vw, 2.1rem);
      font-weight: 800;
      line-height: 1.1;
    }

    .brand-heart {
      display: inline-flex;
      width: 1.18em;
      height: 1.18em;
      align-items: center;
      justify-content: center;
      color: #ff3f63;
      filter: drop-shadow(0 8px 14px rgba(255, 63, 99, 0.25));
      animation: heartBeat 2s ease-in-out infinite;
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: min(100%, 760px);
      margin: 0 auto;
    }

    .panel {
      position: relative;
      overflow: hidden;
      width: 100%;
      background: linear-gradient(180deg, var(--surface), var(--surface-soft));
      border: 1px solid rgba(255, 255, 255, 0.78);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
    }

    .counter-panel {
      padding: clamp(42px, 7vw, 70px) clamp(26px, 8vw, 78px) clamp(38px, 7vw, 58px);
      text-align: center;
    }

    .redeem-panel {
      margin-top: 18px;
      padding: clamp(38px, 7vw, 56px) clamp(28px, 7vw, 58px) clamp(34px, 7vw, 50px);
      text-align: center;
    }

    .sparkles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      color: #ffadb1;
    }

    .sparkles span {
      position: absolute;
      display: grid;
      width: 18px;
      height: 18px;
      place-items: center;
      color: inherit;
      font-size: 17px;
      font-weight: 800;
      opacity: 0.9;
      animation: floaty 4.2s ease-in-out infinite;
    }

    .sparkles span:nth-child(1) { top: 18%; left: 30%; }
    .sparkles span:nth-child(2) { top: 20%; right: 30%; animation-delay: .7s; }
    .sparkles span:nth-child(3) { top: 25%; right: 26%; animation-delay: 1.4s; }
    .sparkles span:nth-child(4) { top: 25%; left: 31%; color: #ff9aa1; animation-delay: 2s; }

    .hero-icon {
      position: relative;
      display: grid;
      width: clamp(104px, 18vw, 132px);
      height: clamp(104px, 18vw, 132px);
      place-items: center;
      margin: 0 auto 44px;
      color: var(--accent);
      background: #fff;
      border-radius: 999px;
      box-shadow: 0 22px 42px rgba(255, 101, 107, 0.16);
    }

    .heart-icon {
      width: 56%;
      height: 56%;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.9;
      filter: drop-shadow(0 10px 14px rgba(255, 101, 107, 0.2));
      animation: pulse 1.7s ease-in-out infinite;
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    .title {
      color: var(--ink);
      font-size: clamp(2.75rem, 8vw, 4.7rem);
      font-weight: 900;
      line-height: 1.02;
    }

    .together {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: clamp(42px, 7vw, 60px);
      color: var(--muted);
      font-size: clamp(1.35rem, 4vw, 2rem);
      font-weight: 500;
    }

    .mini-heart {
      color: #e7bec2;
      font-size: 1.1em;
    }

    .days-row {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: clamp(22px, 5vw, 38px);
    }

    .total-days {
      color: var(--accent);
      font-size: clamp(6.5rem, 22vw, 10.6rem);
      font-weight: 950;
      line-height: 0.86;
      letter-spacing: 0;
      text-shadow: 0 18px 32px rgba(255, 101, 107, 0.2);
    }

    .burst {
      position: absolute;
      top: 52%;
      width: clamp(66px, 15vw, 104px);
      height: 90px;
      transform: translateY(-50%);
      opacity: 0.72;
    }

    .burst-left {
      right: calc(50% + clamp(120px, 25vw, 220px));
    }

    .burst-right {
      left: calc(50% + clamp(120px, 25vw, 220px));
      transform: translateY(-50%) scaleX(-1);
    }

    .burst i {
      position: absolute;
      display: block;
      width: 22px;
      height: 8px;
      background: #ffadb1;
      border-radius: 999px;
    }

    .burst i:nth-child(1) { left: 8px; top: 40px; }
    .burst i:nth-child(2) { right: 10px; top: 12px; transform: rotate(50deg); }
    .burst i:nth-child(3) { right: 8px; bottom: 14px; transform: rotate(-50deg); }

    .days-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      min-height: 64px;
      margin-top: clamp(32px, 6vw, 44px);
      padding: 0 28px;
      color: var(--muted);
      background: rgba(255, 246, 246, 0.92);
      border: 1px solid var(--line);
      border-radius: 999px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75), 0 12px 24px rgba(255, 101, 107, 0.08);
      font-size: clamp(1.25rem, 4vw, 2rem);
      font-weight: 700;
    }

    .calendar-icon {
      width: 30px;
      height: 30px;
      color: var(--accent);
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 26px;
      width: min(100%, 360px);
      margin: clamp(36px, 7vw, 48px) auto 0;
      color: #ff9da4;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 2px;
      flex: 1;
      background: linear-gradient(90deg, transparent, rgba(255, 101, 107, 0.34));
    }

    .divider::after {
      background: linear-gradient(90deg, rgba(255, 101, 107, 0.34), transparent);
    }

    .since {
      margin-top: 34px;
      color: var(--muted);
      font-size: clamp(1.1rem, 3.7vw, 1.5rem);
      font-weight: 500;
    }

    .gift-icon {
      display: grid;
      width: 104px;
      height: 104px;
      place-items: center;
      margin: 0 auto 22px;
      color: var(--accent);
      filter: drop-shadow(0 16px 22px rgba(255, 86, 101, 0.22));
      animation: giftFloat 3s ease-in-out infinite;
    }

    .gift-icon svg {
      width: 92px;
      height: 92px;
    }

    .redeem-title {
      color: var(--ink);
      font-size: clamp(1.75rem, 5vw, 2.55rem);
      font-weight: 900;
      line-height: 1.1;
    }

    .redeem-status {
      margin-top: 24px;
      color: var(--muted);
      font-size: clamp(1.12rem, 3.8vw, 1.65rem);
      font-weight: 500;
    }

    .redeem-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      width: 100%;
      min-height: clamp(72px, 14vw, 94px);
      margin-top: clamp(34px, 7vw, 44px);
      padding: 0 28px;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      border: 0;
      border-radius: 999px;
      box-shadow: 0 18px 30px rgba(255, 91, 101, 0.28);
      cursor: pointer;
      font-size: clamp(1.15rem, 4.3vw, 2rem);
      font-weight: 850;
      line-height: 1.1;
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
      animation: breath 2.3s ease-in-out infinite;
    }

    .redeem-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 22px 38px rgba(255, 91, 101, 0.34);
      filter: saturate(1.04);
    }

    .redeem-button:focus-visible {
      outline: 4px solid rgba(255, 101, 107, 0.22);
      outline-offset: 5px;
    }

    .redeem-button.is-open {
      background: linear-gradient(135deg, #26b981, #12a56f);
      box-shadow: 0 18px 30px rgba(38, 185, 129, 0.24);
    }

    .button-icon {
      font-size: 1.05em;
      line-height: 1;
    }

    .footer {
      position: relative;
      z-index: 1;
      margin-top: 30px;
      color: var(--muted);
      text-align: center;
      font-size: clamp(1rem, 3.5vw, 1.38rem);
      font-weight: 500;
    }

    .footer .heart {
      display: inline-block;
      margin: 0 8px;
      color: #ff4062;
      filter: drop-shadow(0 6px 10px rgba(255, 64, 98, 0.2));
    }

    .floating-heart {
      position: fixed;
      z-index: 0;
      color: rgba(255, 151, 158, 0.48);
      font-size: clamp(28px, 5vw, 46px);
      pointer-events: none;
      animation: floaty 5s ease-in-out infinite;
    }

    .floating-heart.one { left: 7%; bottom: 7%; }
    .floating-heart.two { right: 5%; bottom: 20%; animation-delay: 1.2s; }
    .floating-heart.three { right: 10%; bottom: 4%; font-size: 24px; animation-delay: 2.1s; }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.is-visible {
      display: flex;
    }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(32, 42, 63, 0.38);
      backdrop-filter: blur(8px);
    }

    .modal-card {
      position: relative;
      width: min(100%, 390px);
      padding: 26px;
      background: #fff;
      border-radius: 28px;
      box-shadow: 0 28px 80px rgba(32, 42, 63, 0.24);
    }

    .modal-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .modal-title {
      color: var(--ink);
      font-size: 1.18rem;
      font-weight: 850;
    }

    .modal-close {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      color: var(--muted);
      background: var(--accent-soft);
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .modal-text {
      margin-top: 16px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.55;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 22px;
    }

    .modal-ok {
      min-height: 42px;
      padding: 0 18px;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 750;
    }

    .pop {
      animation: pop .32s ease-out;
    }

    @keyframes pop {
      0% { transform: scale(.96); opacity: .7; }
      60% { transform: scale(1.04); opacity: 1; }
      100% { transform: scale(1); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.12); opacity: .86; }
    }

    @keyframes breath {
      0%, 100% { transform: translateZ(0) scale(1); }
      50% { transform: translateZ(0) scale(1.018); }
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      45% { transform: scale(1.1); }
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }

    @keyframes giftFloat {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }

    @media (max-width: 620px) {
      :root {
        --radius-lg: 34px;
        --radius-md: 28px;
      }

      .page {
        padding-inline: 14px;
      }

      .brand {
        gap: 9px;
        margin-bottom: 18px;
      }

      .counter-panel {
        min-height: auto;
        padding-top: 38px;
      }

      .sparkles span:nth-child(1) { left: 22%; }
      .sparkles span:nth-child(2) { right: 20%; }
      .sparkles span:nth-child(3) { right: 16%; }
      .sparkles span:nth-child(4) { left: 22%; }

      .hero-icon {
        margin-bottom: 34px;
      }

      .together {
        gap: 13px;
      }

      .burst {
        display: none;
      }

      .days-pill {
        min-height: 54px;
        padding-inline: 22px;
      }

      .calendar-icon {
        width: 24px;
        height: 24px;
      }

      .gift-icon {
        width: 86px;
        height: 86px;
      }

      .gift-icon svg {
        width: 78px;
        height: 78px;
      }

      .redeem-button {
        gap: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="floating-heart one">♥</div>
    <div class="floating-heart two">♥</div>
    <div class="floating-heart three">♥</div>

    <header class="brand" aria-label="Gatinho coração Gatinha">
      <span>Gatinho</span>
      <span class="brand-heart" aria-hidden="true">♥</span>
      <span>Gatinha</span>
    </header>

    <main class="wrap">
      <section class="panel counter-panel" aria-labelledby="counterTitle">
        <div class="sparkles" aria-hidden="true">
          <span>✦</span>
          <span>✦</span>
          <span>✦</span>
          <span>♥</span>
        </div>

        <div class="hero-icon" aria-hidden="true">
          <svg class="heart-icon" viewBox="0 0 24 24">
            <path d="M12 20.6S4.7 16 3 10.7C1.9 7.2 4 4.4 7.2 4.4c2 0 3.5 1.2 4.1 2.5.7-1.3 2.1-2.5 4.2-2.5 3.2 0 5.3 2.8 4.2 6.3C18 16 12 20.6 12 20.6Z" />
          </svg>
        </div>

        <h1 id="counterTitle" class="title">Nosso Tempo</h1>

        <p class="together">
          <span class="mini-heart" aria-hidden="true">♥</span>
          <span>Juntos há</span>
          <span class="mini-heart" aria-hidden="true">♥</span>
        </p>

        <div class="days-row">
          <span class="burst burst-left" aria-hidden="true"><i></i><i></i><i></i></span>
          <span id="totalDays" class="total-days pop">0</span>
          <span class="burst burst-right" aria-hidden="true"><i></i><i></i><i></i></span>
        </div>

        <div class="days-pill" aria-label="dias juntos">
          <svg class="calendar-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="4" y="5.5" width="16" height="15" rx="2.6" stroke="currentColor" stroke-width="2" />
            <path d="M8 3.5v4M16 3.5v4M4 10h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <path d="M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
          </svg>
          <span>dias</span>
        </div>

        <div class="divider" aria-hidden="true">♥</div>
        <p id="sinceDate" class="since">Desde 15/02/2025</p>
      </section>

      <section class="panel redeem-panel" aria-labelledby="redeemTitle">
        <div class="sparkles" aria-hidden="true">
          <span>✦</span>
          <span>✦</span>
          <span>✦</span>
          <span>✦</span>
        </div>

        <div class="gift-icon" aria-hidden="true">
          <svg viewBox="0 0 96 96" fill="none">
            <path d="M21 39h54v37a6 6 0 0 1-6 6H27a6 6 0 0 1-6-6V39Z" fill="#ff5f6c" />
            <path d="M21 39h54v12H21V39Z" fill="#ff7b84" />
            <path d="M42 39h13v43H42V39Z" fill="#e83e57" />
            <path d="M16 29a5 5 0 0 1 5-5h54a5 5 0 0 1 5 5v12H16V29Z" fill="#ff727b" />
            <path d="M41 24c-3-8-10-13-16-9-6 4-3 13 8 17 5 2 10 2 15 1-2-2-5-5-7-9Z" fill="#ff8f96" />
            <path d="M55 24c3-8 10-13 16-9 6 4 3 13-8 17-5 2-10 2-15 1 2-2 5-5 7-9Z" fill="#ff8f96" />
            <path d="M42 24c3 6 5 10 6 10s3-4 6-10" stroke="#df3752" stroke-width="7" stroke-linecap="round" />
            <path d="M42 24c-6-10-17-12-20-5-4 8 10 14 26 15M54 24c6-10 17-12 20-5 4 8-10 14-26 15" stroke="#f24a61" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>

        <h2 id="redeemTitle" class="redeem-title">Cartão + Brinde do mês</h2>
        <p id="redeemStatus" class="redeem-status">Verificando...</p>
        <button id="btnRedeem" class="redeem-button" type="button">
          <span class="button-icon" aria-hidden="true">🎁</span>
          <span>Resgatar no dia 15</span>
        </button>
      </section>
    </main>

    <footer class="footer">
      Feito com <span class="heart">♥</span> para minha gatinha
    </footer>
  </div>

  <div id="infoModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
    <div class="modal-backdrop" data-close="infoModal"></div>
    <div class="modal-card">
      <div class="modal-top">
        <h3 id="infoTitle" class="modal-title">Aviso</h3>
        <button data-close="infoModal" class="modal-close" type="button" aria-label="Fechar">×</button>
      </div>
      <p id="infoText" class="modal-text">Aguarde o dia 15 para resgatar 💖</p>
      <div class="modal-actions">
        <button data-close="infoModal" class="modal-ok" type="button">Fechar</button>
      </div>
    </div>
  </div>

  <script>
    // ===== Configuração =====
    const START_DATE_ISO = '2025-02-15'; // início do relacionamento (YYYY-MM-DD)
    const WA_URL = 'https://wa.me/5551999970775?text=Acabei%20de%20resgatar%20o%20meu%20*cart%C3%A3o*%20do%20dia%2015!%20%F0%9F%92%8C';

    // ===== Utilitários de data (timezone America/Sao_Paulo) =====
    function getTodayBR(){
      const parts = new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',year:'numeric'}).formatToParts(new Date());
      const m = Object.fromEntries(parts.map(p=>[p.type,p.value]));
      return new Date(+m.year, +m.month-1, +m.day);
    }
    function parseISODateOnly(iso){ const [Y,M,D]=iso.split('-').map(Number); return new Date(Y,M-1,D); }
    function diffDays(a,b){ return Math.floor((b-a)/(24*60*60*1000)); }

    // ===== Elementos =====
    const el = {
      totalDays: document.getElementById('totalDays'),
      sinceDate: document.getElementById('sinceDate'),
      btn: document.getElementById('btnRedeem'),
      status: document.getElementById('redeemStatus')
    };

    // ===== Contador =====
    function updateCounter(){
      const today = getTodayBR();
      const start = parseISODateOnly(START_DATE_ISO);
      const total = diffDays(start,today);
      el.totalDays.textContent = total;
      el.totalDays.classList.remove('pop'); void el.totalDays.offsetWidth; el.totalDays.classList.add('pop');
    }

    // ===== Regras de resgate =====
    function canRedeemToday(){
      const today = getTodayBR();
      return { ok: today.getDate() === 15 };
    }

    function updateButton(){
      const av = canRedeemToday();
      const t = getTodayBR();
      const dayText = `${String(t.getDate()).padStart(2,'0')}/${String(t.getMonth()+1).padStart(2,'0')}`;

      el.btn.disabled = false;

      if (av.ok) {
        el.btn.onclick = () => window.open(WA_URL, '_blank');
        el.btn.className = 'redeem-button is-open';
        el.btn.innerHTML = '<span class="button-icon" aria-hidden="true">🎁</span><span>Resgatar agora</span>';
        el.status.textContent = 'Disponível hoje (dia 15)';
      } else {
        el.btn.onclick = () => openInfo('Aguarde o dia 15 para resgatar 💖');
        el.btn.className = 'redeem-button';
        el.btn.innerHTML = '<span class="button-icon" aria-hidden="true">🎁</span><span>Resgatar no dia 15</span>';
        el.status.textContent = `Hoje é ${dayText}`;
      }
    }

    // ===== Modal helpers =====
    const infoModal = document.getElementById('infoModal');
    const infoText = document.getElementById('infoText');
    function openInfo(msg){
      infoText.textContent = msg || 'Aguarde o dia 15 para resgatar 💖';
      infoModal.classList.add('is-visible');
    }
    function closeInfo(){ infoModal.classList.remove('is-visible'); }
    document.addEventListener('click', (e)=>{ const c=e.target.closest('[data-close]'); if(c){ closeInfo(); }});
    document.addEventListener('keydown', (e)=>{ if(e.key==='Escape'){ closeInfo(); }});

    // ===== Testes rápidos (console) =====
    function canRedeemOn(dateISO){ const d=parseISODateOnly(dateISO); return d.getDate()===15; }
    console.assert(canRedeemOn('2025-10-15')===true,  'Teste: 15/10 deve permitir');
    console.assert(canRedeemOn('2025-10-14')===false, 'Teste: 14/10 deve bloquear');
    console.assert(canRedeemOn('2025-02-15')===true,  'Teste: 15/02 deve permitir');
    console.assert(canRedeemOn('2025-02-28')===false, 'Teste: 28/02 deve bloquear');

    (function init(){ updateCounter(); updateButton(); })();
